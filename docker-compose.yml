version: '3.8'
services:
  trueehr-server:
    build: ./server
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      NODE_ENV: production
  trueehr-client:
    build: ./
    ports:
      - '3000:3000'
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:4000/api
    depends_on:
      trueehr-server:
        condition: service_healthy